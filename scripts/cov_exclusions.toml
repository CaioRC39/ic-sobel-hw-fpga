# ---------------- sobel_multicycle: monitor o_status ----------------
# Os runners de injecao (test_pipeline_status.py) afirmam a mascara EXATA de o_status; sob Verilator
# eles sao pulados (expect_errors > 0). Cobertos no Icarus, nao medidos.
[[exclude]]
id = "SM-01"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "assign e1_event = skid_overflow"
class = "so-icarus"
reason = "Termos de overflow do monitor (bit 0 de o_status)."
proof = "E1 por fiacao: Force no o_overflow de u_skid e de u_lw_skid"
proof_test = "test_pipeline_status.py::test_status_E1_wiring_u_skid"

[[exclude]]
id = "SM-02"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "if (e1_event && !status_r[0])"
class = "so-icarus"
reason = "$error de localizacao do bit 0."
proof = "E1 por fiacao"
proof_test = "test_pipeline_status.py::test_status_E1_wiring_u_skid"

[[exclude]]
id = "SM-03"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "assign e2_mismatch = e2_check"
class = "so-icarus"
reason = "Condicao de balanco de janelas (bit 1)."
proof = "Injecao B (perda a jusante) acende o bit 1"
proof_test = "test_pipeline_status.py::test_status_B_sets_bit1"

[[exclude]]
id = "SM-04"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "if (e2_mismatch && !status_r[1])"
class = "so-icarus"
reason = "$error de localizacao do bit 1."
proof = "Injecao B"
proof_test = "test_pipeline_status.py::test_status_B_sets_bit1"

[[exclude]]
id = "SM-05"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "assign d_mismatch = drained_d"
class = "so-icarus"
reason = "Condicao de dessincronia a montante (bit 2)."
proof = "Injecao I1 (perda a montante) acende o bit 2"
proof_test = "test_pipeline_status.py::test_status_I1_sets_bit2"

[[exclude]]
id = "SM-06"
file = "multicycle/sobel_multicycle.sv"
kind = "expr"
text = "if (d_mismatch && !status_r[2])"
class = "so-icarus"
reason = "$error de localizacao do bit 2."
proof = "Injecao I1"
proof_test = "test_pipeline_status.py::test_status_I1_sets_bit2"

