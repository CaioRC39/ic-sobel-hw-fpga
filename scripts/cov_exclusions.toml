# Exclusoes de cobertura (Fase 4, etapa 4.4). Lido por scripts/cov_report.py.
# class = "inalcancavel": o ponto nao ocorre no projeto (prova em 'proof').
# class = "so-icarus"   : coberto so por runner negativo no Icarus (pulado sob Verilator,
#                         onde $error aborta); 'proof_test' e verificado pelo agregador
#                         (arquivo e funcao existem), mas a cobertura NAO e medida.
# Seletores por TEXTO da linha ou SINAL/BIT, nunca por numero de linha.

# ---------------- mac_unit ----------------
[[exclude]]
id = "MU-01"
file = "multicycle/mac_unit.sv"
kind = "toggle"
signal = "pixel_ext"
bits = "ACC_WIDTH-1:DATA_WIDTH"
params = { ACC_WIDTH = 11, DATA_WIDTH = 8 }
class = "inalcancavel"
reason = "Extensao com zeros: bits constantes 1'b0, nao podem alternar."
proof = "rtl/multicycle/mac_unit.sv: assign pixel_ext = {{(ACC_WIDTH - DATA_WIDTH) {1'b0}}, i_pixel}"

# ---------------- abs_saturate ----------------
[[exclude]]
id = "AS-01"
file = "common/abs_saturate.sv"
kind = "toggle"
signal = "abs_val"
bits = "IN_WIDTH"
params = { IN_WIDTH = 11 }
class = "inalcancavel"
reason = "Modulo maximo = 2^(IN_WIDTH-1) (valor minimo com sinal): o bit IN_WIDTH nunca liga."
proof = "rtl/common/abs_saturate.sv: value_ext tem IN_WIDTH+1 bits a partir de i_value de IN_WIDTH bits com sinal"

# ---------------- mac_control_fsm ----------------
[[exclude]]
id = "FSM-01"
file = "multicycle/mac_control_fsm.sv"
kind = "line"
text = "default: state_r <= S_IDLE;"
class = "inalcancavel"
reason = "Braco default do case de estados: so executa com state_r em 16..31."
proof = "test_fsm_state_arc_coverage.py afirma 0 estados ilegais; enum de 16 estados validos"

[[exclude]]
id = "FSM-02"
file = "multicycle/mac_control_fsm.sv"
kind = "toggle"
signal = "state_r"
bits = "4"
params = {}
class = "inalcancavel"
reason = "O bit 4 de state_r so vale 1 nos estados 16..31, que nao ocorrem."
proof = "test_fsm_state_arc_coverage.py: 16/16 estados, 0 ilegais"

[[exclude]]
id = "FSM-03"
file = "multicycle/mac_control_fsm.sv"
kind = "expr"
text = "if (rst_n && i_valid && !o_ready)"
class = "so-icarus"
reason = "Condicao do $error de contrato; so o runner negativo a exercita."
proof = "Runner negativo com expect_errors=4 (pulado sob Verilator)"
proof_test = "test_mac_control_fsm.py::test_contract_violation_detected"

